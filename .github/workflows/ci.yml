name: Repository safety

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: repository-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-active-surface:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact GitHub revision
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$SOURCE_URL"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_REF"
          git checkout --detach FETCH_HEAD

      - name: Enforce one inert validation workflow
        shell: bash
        run: |
          set -euo pipefail

          workflow_count="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | wc -l | tr -d '[:space:]')"
          test "$workflow_count" = "1"
          test -f .github/workflows/ci.yml

          if grep -En '^[[:space:]]+(schedule|issues|issue_comment|pull_request_review|pull_request_review_comment|workflow_dispatch):' .github/workflows/ci.yml; then
            echo 'Autonomous or manual runtime triggers are forbidden.' >&2
            exit 1
          fi

          if grep -En '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows/ci.yml; then
            echo 'External GitHub Actions are forbidden.' >&2
            exit 1
          fi

          provider_name="$(printf '%s%s' gem ini)"
          provider_key="$(printf '%s%s' google _api_key)"
          app_key="$(printf '%s%s' app _private_key)"
          provider_action="$(printf '%s%s' run- gemini-cli)"
          if grep -Ein "$provider_name|$provider_key|$app_key|$provider_action" .github/workflows/ci.yml; then
            echo 'Provider-specific automation is forbidden.' >&2
            exit 1
          fi

          if grep -En '^[[:space:]]+(npm|npx|pip|python[[:space:]]+-m[[:space:]]+pip|brew|bun|cargo|apt-get)[[:space:]]' .github/workflows/ci.yml; then
            echo 'Package and runtime installation is forbidden.' >&2
            exit 1
          fi
