name: Corvus Star CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
    
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install exact npm release
      run: npm install --global npm@11.11.0 --ignore-scripts --no-audit --no-fund

    - name: Install locked dependencies
      run: npm ci --ignore-scripts --no-audit --no-fund

    - name: Build the required native runtime dependency
      run: npm rebuild better-sqlite3 --foreground-scripts --no-audit --no-fund
      env:
        npm_config_build_from_source: 'true'

    - name: Install Python test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Install Bubblewrap runtime
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --yes bubblewrap

    - name: Bind the selected Python executable
      run: python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('CSTAR_PYTHON_EXECUTABLE=' + sys.executable + '\n')"
        
    - name: Lint with Ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        python -m ruff check . --select E9,F63,F7,F82 --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        python -m ruff check . --exit-zero --statistics

    - name: Validate Generated Distribution Artifacts
      if: runner.os == 'Windows'
      run: npm run validate:distributions

    - name: Prepare Release Artifacts
      if: runner.os == 'Linux'
      run: npm run release:prepare
        
    - name: Test Unified Suite (Node & Python)
      run: npm test
