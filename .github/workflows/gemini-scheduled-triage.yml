name: '📋 Gemini Scheduled Issue Triage'

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  pull_request:
    branches:
      - 'main'
      - 'release/**/*'
    paths:
      - '.github/workflows/gemini-scheduled-triage.yml'
  push:
    branches:
      - 'main'
      - 'release/**/*'
    paths:
      - '.github/workflows/gemini-scheduled-triage.yml'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  triage:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'read'
      pull-requests: 'read'
    outputs:
      available_labels: '${{ steps.get_labels.outputs.available_labels }}'
      allowed_issue_numbers: '${{ steps.find_issues.outputs.allowed_issue_numbers }}'
      triaged_issues: '${{ steps.gemini_issue_analysis.outputs.summary }}'
    steps:
      - name: 'Checkout trusted workflow commands'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - name: 'Get repository labels'
        id: 'get_labels'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8.0.0
        with:
          # NOTE: we intentionally do not use the minted token. The default
          # GITHUB_TOKEN provided by the action has enough permissions to read
          # the labels.
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100, // Maximum per page to reduce API calls
            })) {
              labels.push(...response.data);
            }

            if (!labels || labels.length === 0) {
              core.setFailed('There are no issue labels in this repository.')
            }

            const labelNames = labels.map(label => label.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            core.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);
            return labelNames;

      - name: 'Find untriaged issues'
        id: 'find_issues'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8.0.0
        with:
          script: |-
            const issues = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })) {
              for (const issue of response.data) {
                if (issue.pull_request) {
                  continue;
                }
                const labels = issue.labels.map((label) =>
                  typeof label === 'string' ? label : label.name
                );
                if (labels.length === 0 || labels.includes('status/needs-triage')) {
                  issues.push({
                    number: issue.number,
                    title: issue.title,
                    body: issue.body || '',
                  });
                }
                if (issues.length === 100) {
                  break;
                }
              }
              if (issues.length === 100) {
                break;
              }
            }

            const allowedIssueNumbers = issues.map((issue) => issue.number);
            core.setOutput('issues_to_triage', JSON.stringify(issues));
            core.setOutput('allowed_issue_numbers', JSON.stringify(allowedIssueNumbers));
            core.info(`Found ${issues.length} issue(s) to triage.`);

      - name: 'Prepare bounded scheduled-triage context'
        if: |-
          ${{ steps.find_issues.outputs.issues_to_triage != '[]' }}
        env:
          AVAILABLE_LABELS: '${{ steps.get_labels.outputs.available_labels }}'
          ISSUES_TO_TRIAGE: '${{ steps.find_issues.outputs.issues_to_triage }}'
        run: |-
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const issues = JSON.parse(process.env.ISSUES_TO_TRIAGE || '[]');
          fs.mkdirSync('.gemini', { recursive: true });
          fs.writeFileSync('.gemini/context.json', JSON.stringify({
            available_labels: process.env.AVAILABLE_LABELS || '',
            issues_to_triage: issues,
          }), {
            encoding: 'utf8',
            mode: 0o600,
          });
          NODE

      - name: 'Run Gemini Issue Analysis'
        id: 'gemini_issue_analysis'
        if: |-
          ${{ steps.find_issues.outputs.issues_to_triage != '[]' }}
        uses: 'google-github-actions/run-gemini-cli@v0' # ratchet:exclude
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '' # Do not pass any auth token here since this runs on untrusted inputs
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-scheduled-triage'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": []
              }
            }
          prompt: '/gemini-scheduled-triage'

  label:
    runs-on: 'ubuntu-latest'
    needs:
      - 'triage'
    if: |-
      needs.triage.outputs.available_labels != '' &&
      needs.triage.outputs.available_labels != '[]' &&
      needs.triage.outputs.triaged_issues != '' &&
      needs.triage.outputs.triaged_issues != '[]'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Apply labels'
        env:
          AVAILABLE_LABELS: '${{ needs.triage.outputs.available_labels }}'
          ALLOWED_ISSUE_NUMBERS: '${{ needs.triage.outputs.allowed_issue_numbers }}'
          TRIAGED_ISSUES: '${{ needs.triage.outputs.triaged_issues }}'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8.0.0
        with:
          # Use the provided token so that the "gemini-cli" is the actor in the
          # log for what changed the labels.
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          script: |-
            const availableLabels = new Set(
              (process.env.AVAILABLE_LABELS || '')
                .split(',')
                .map((label) => label.trim())
                .filter(Boolean)
            );
            const allowedIssueNumbers = new Set(
              JSON.parse(process.env.ALLOWED_ISSUE_NUMBERS || '[]')
            );
            const parsed = JSON.parse(process.env.TRIAGED_ISSUES || '[]');
            if (!Array.isArray(parsed) || parsed.length > 100) {
              throw new Error('Gemini triage output must be an array of at most 100 items.');
            }

            const seenIssueNumbers = new Set();
            const validated = parsed.map((issue) => {
              if (!issue || typeof issue !== 'object' || Array.isArray(issue)) {
                throw new Error('Gemini triage output contains a non-object item.');
              }
              const keys = Object.keys(issue).sort();
              if (JSON.stringify(keys) !== JSON.stringify(['issue_number', 'labels_to_set'])) {
                throw new Error('Gemini triage output contains unexpected fields.');
              }
              const issueNumber = issue.issue_number;
              if (
                !Number.isSafeInteger(issueNumber) ||
                issueNumber <= 0 ||
                !allowedIssueNumbers.has(issueNumber) ||
                seenIssueNumbers.has(issueNumber)
              ) {
                throw new Error('Gemini triage output contains an invalid issue number.');
              }
              if (
                !Array.isArray(issue.labels_to_set) ||
                !issue.labels_to_set.every((label) => typeof label === 'string')
              ) {
                throw new Error('Gemini triage output contains invalid labels.');
              }
              seenIssueNumbers.add(issueNumber);
              const labels = [...new Set(issue.labels_to_set)]
                .map((label) => label.trim())
                .filter((label) => availableLabels.has(label))
                .sort();
              return { issueNumber, labels };
            }).sort((a, b) => a.issueNumber - b.issueNumber);

            for (const issue of validated) {
              if (issue.labels.length === 0) {
                core.info(`Skipping issue #${issue.issueNumber}: no valid labels.`);
                continue;
              }
              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.issueNumber,
                labels: issue.labels,
              });
              core.info(`Set ${issue.labels.length} label(s) on issue #${issue.issueNumber}.`);
            }
